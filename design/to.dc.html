<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F5F0;color:#26262B;font-family:"IBM Plex Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
a{color:#3F7CB0}a:hover{color:#26262B}
button{font-family:inherit}
</style>
</helmet>
<div style="min-height:100vh;background:#F7F5F0;color:#26262B;font-family:'IBM Plex Sans JP',sans-serif">
  <header style="max-width:960px;margin:0 auto;padding:20px 20px 0;display:flex;align-items:center;justify-content:space-between;gap:16px">
    <button onClick="{{ goTop }}" aria-label="to トップへ" style="display:flex;align-items:center;gap:10px;background:none;border:0;padding:6px 0;cursor:pointer;color:#26262B">
      <svg width="40" height="20" viewBox="0 0 40 20" aria-hidden="true" style="display:block">
        <path d="M8 8 Q20 -1 32 8" stroke="#26262B" stroke-width="1.4" fill="none" stroke-linecap="round"></path>
        <path d="M32 12 Q20 21 8 12" stroke="#26262B" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-dasharray="2 3"></path>
        <circle cx="6" cy="10" r="4.5" fill="#DD6B4D"></circle>
        <circle cx="34" cy="10" r="4.5" fill="#3F7CB0"></circle>
      </svg>
      <span style="font-size:20px;font-weight:600;letter-spacing:.02em;line-height:1">to</span>
    </button>
    <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:flex-end">
    <button onClick="{{ toggleCvd }}" aria-pressed="{{ cvdStr }}" style="display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:18px;border:1.5px solid #D8D3C8;background:transparent;color:#26262B;font-size:13px;cursor:pointer" style-hover="border-color:#26262B">
      <span style="{{ cvdKnob }}"></span>色に頼らない表示
    </button>
    <a href="https://craftpaperbag.github.io/zu/" style="font-size:13px;color:#6A6770;text-decoration:none" style-hover="color:#26262B">姉妹サイト zu</a>
    </div>
  </header>
  <sc-if value="{{ isTop }}" hint-placeholder-val="{{ true }}">
  <main data-screen-label="01 トップ" style="max-width:960px;margin:0 auto;padding:0 20px 80px">
    <section style="padding:72px 0 56px;max-width:560px">
      <h1 style="margin:0;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;font-weight:600">
        <span style="font-size:64px;line-height:1;letter-spacing:.01em">to</span>
        <span style="font-size:18px;font-weight:500">言いあえる関係について</span>
      </h1>
      <p style="margin:28px 0 0;font-size:16px;line-height:1.95;text-wrap:pretty">言いにくいことも、お互いに言える関係をつくるためのコツを、一枚ずつ図にして集めています。</p>
      <div style="margin-top:32px;display:flex;align-items:center;gap:20px;flex-wrap:wrap">
        <button onClick="{{ openRandom }}" style="display:flex;align-items:center;gap:10px;height:48px;padding:0 22px;border-radius:24px;border:0;background:#26262B;color:#F7F5F0;font-size:15px;font-weight:500;cursor:pointer" style-hover="background:#3a3a40">
          <svg width="22" height="14" viewBox="0 0 22 14" aria-hidden="true"><circle cx="4" cy="7" r="3" fill="#DD6B4D"></circle><circle cx="18" cy="7" r="3" fill="#3F7CB0"></circle><path d="M8 7 H14" stroke="#F7F5F0" stroke-width="1.4" stroke-linecap="round"></path></svg>
          ランダムに一枚
        </button>
        <span style="font-size:13px;color:#6A6770;white-space:nowrap;flex-shrink:0">いま {{ count }} 枚</span>
      </div>
    </section>
    <section aria-label="図の色の意味" style="display:flex;flex-wrap:wrap;gap:8px 24px;padding:16px 0;border-top:1px solid #E2DED5;border-bottom:1px solid #E2DED5;font-size:13px;color:#4A4850">
      <span style="display:flex;align-items:center;gap:8px"><span style="{{ sw10.speak }}"></span>話す人</span>
      <span style="display:flex;align-items:center;gap:8px"><span style="{{ sw10.listen }}"></span>受け取る人</span>
      <span style="display:flex;align-items:center;gap:8px"><span style="{{ sw10.share }}"></span>二人のあいだで共有されたもの</span>
    </section>
    <nav aria-label="カテゴリ" style="margin:32px 0 24px;display:flex;flex-wrap:wrap;gap:8px">
      <sc-for list="{{ cats }}" as="c" hint-placeholder-count="6">
        <sc-if value="{{ c.active }}" hint-placeholder-val="{{ false }}">
          <button onClick="{{ c.select }}" aria-pressed="true" style="height:40px;padding:0 16px;border-radius:20px;border:1.5px solid #26262B;background:#26262B;color:#F7F5F0;font-size:14px;cursor:pointer">{{ c.label }}</button>
        </sc-if>
        <sc-if value="{{ c.inactive }}" hint-placeholder-val="{{ true }}">
          <button onClick="{{ c.select }}" aria-pressed="false" style="height:40px;padding:0 16px;border-radius:20px;border:1.5px solid #D8D3C8;background:transparent;color:#26262B;font-size:14px;cursor:pointer" style-hover="border-color:#26262B">{{ c.label }}</button>
        </sc-if>
      </sc-for>
    </nav>
    <sc-if value="{{ hasTips }}" hint-placeholder-val="{{ true }}">
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,272px),1fr));gap:16px">
        <sc-for list="{{ filtered }}" as="t" hint-placeholder-count="3">
          <button onClick="{{ t.open }}" style="text-align:left;background:#FFFFFF;border:1px solid #E7E3DA;border-radius:14px;padding:0;cursor:pointer;display:flex;flex-direction:column;color:#26262B;overflow:hidden" style-hover="border-color:#26262B">
            <div style="padding:28px 28px 20px">
              <div style="aspect-ratio:36/22;width:100%;display:flex;align-items:center;justify-content:center">
                <dc-import name="TipVisual" tip-id="{{ t.id }}" still="{{ cardStill }}" captions="{{ false }}" cvd="{{ cvd }}" hint-size="100%,130px" style="width:100%"></dc-import>
              </div>
            </div>
            <div style="flex:1;padding:16px 20px 20px;border-top:1px solid #F0EDE6;display:flex;flex-direction:column;gap:8px">
              <span style="display:flex;gap:10px;font-size:12px;color:#6A6770"><span style="font-family:'IBM Plex Mono',monospace">{{ t.no }}</span><span>{{ t.cat }}</span></span>
              <span style="font-size:17px;font-weight:600;line-height:1.55;text-wrap:pretty">{{ t.title }}</span>
            </div>
          </button>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ noTips }}" hint-placeholder-val="{{ false }}">
      <div style="padding:56px 20px;border:1px dashed #D8D3C8;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center">
        <svg width="72" height="24" viewBox="0 0 72 24" aria-hidden="true"><circle cx="8" cy="12" r="6" fill="#DD6B4D"></circle><circle cx="64" cy="12" r="6" fill="#3F7CB0"></circle><path d="M18 12 H54" stroke="#B9B3A7" stroke-width="1.4" stroke-dasharray="2 4"></path></svg>
        <p style="margin:0;font-size:14px;line-height:1.8;color:#4A4850">「{{ catLabel }}」の図は、まだ描いている途中です。</p>
      </div>
    </sc-if>
  </main>
  </sc-if>
  <sc-if value="{{ isDetail }}" hint-placeholder-val="{{ false }}">
  <main data-screen-label="02 Tips詳細" style="max-width:640px;margin:0 auto;padding:0 20px 80px">
    <div style="padding:32px 0 0">
      <button onClick="{{ goTop }}" style="background:none;border:0;padding:8px 0;font-size:13px;color:#6A6770;cursor:pointer" style-hover="color:#26262B">← 一覧へ</button>
    </div>
    <article>
      <div style="margin-top:28px;display:flex;gap:12px;font-size:13px;color:#6A6770">
        <span style="font-family:'IBM Plex Mono',monospace">{{ tip.no }}</span><span>{{ tip.cat }}</span>
      </div>
      <h1 style="margin:12px 0 0;font-size:28px;line-height:1.5;font-weight:600;text-wrap:pretty">{{ tip.title }}</h1>
      <p style="margin:20px 0 0;font-size:17px;line-height:1.9;text-wrap:pretty">{{ tip.claim }}</p>
      <figure style="margin:36px 0 0;background:#FFFFFF;border:1px solid #E7E3DA;border-radius:16px;padding:32px 24px 20px">
        <dc-import name="TipVisual" tip-id="{{ tip.id }}" still="{{ still }}" captions="{{ true }}" cvd="{{ cvd }}" hint-size="100%,200px"></dc-import>
        <figcaption style="margin-top:20px;padding-top:14px;border-top:1px solid #F0EDE6;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:#4A4850">
          <span style="display:flex;align-items:center;gap:6px"><span style="{{ sw8.speak }}"></span>話す人</span>
          <span style="display:flex;align-items:center;gap:6px"><span style="{{ sw8.listen }}"></span>受け取る人</span>
          <span style="display:flex;align-items:center;gap:6px"><span style="{{ sw8.share }}"></span>共有されたもの</span>
        </figcaption>
      </figure>
      <section style="margin-top:44px">
        <h2 style="margin:0;font-size:13px;font-weight:500;color:#6A6770;letter-spacing:.04em">なぜ</h2>
        <p style="margin:10px 0 0;font-size:16px;line-height:1.95;text-wrap:pretty">{{ tip.why }}</p>
      </section>
      <section style="margin-top:36px;background:#EAF3EE;border-radius:14px;padding:22px 22px 24px">
        <h2 style="margin:0;font-size:13px;font-weight:500;color:#2F6B4E;letter-spacing:.04em;display:flex;align-items:center;gap:8px">
          <svg width="20" height="10" viewBox="0 0 20 10" aria-hidden="true"><circle cx="3" cy="5" r="3" fill="#4FA27A"></circle><path d="M8 5 H18 M14 1.5 L18 5 L14 8.5" stroke="#4FA27A" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          明日ためしてみる
        </h2>
        <p style="margin:10px 0 0;font-size:16px;line-height:1.85;text-wrap:pretty">{{ tip.apply }}</p>
      </section>
    </article>
    <nav aria-label="前後のTips" style="margin-top:56px;padding-top:20px;border-top:1px solid #E2DED5;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px">
      <sc-if value="{{ hasPrev }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ goPrev }}" style="text-align:left;background:none;border:1px solid #E2DED5;border-radius:12px;padding:14px 16px;cursor:pointer;color:#26262B;display:flex;flex-direction:column;gap:6px;min-height:72px" style-hover="border-color:#26262B">
          <span style="font-size:12px;color:#6A6770">← 前へ</span>
          <span style="font-size:14px;line-height:1.5;font-weight:500">{{ prevTitle }}</span>
        </button>
      </sc-if>
      <sc-if value="{{ noPrev }}" hint-placeholder-val="{{ true }}"><span></span></sc-if>
      <sc-if value="{{ hasNext }}" hint-placeholder-val="{{ true }}">
        <button onClick="{{ goNext }}" style="text-align:right;background:none;border:1px solid #E2DED5;border-radius:12px;padding:14px 16px;cursor:pointer;color:#26262B;display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-height:72px" style-hover="border-color:#26262B">
          <span style="font-size:12px;color:#6A6770">次へ →</span>
          <span style="font-size:14px;line-height:1.5;font-weight:500">{{ nextTitle }}</span>
        </button>
      </sc-if>
    </nav>
  </main>
  </sc-if>
  <footer style="max-width:960px;margin:0 auto;padding:24px 20px 40px;border-top:1px solid #E2DED5;font-size:12px;color:#8A8690;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">
    <span>to - 言いあえる関係について</span>
    <span>図は試しながら、少しずつ増えていきます。</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;startPage&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;top&quot;,&quot;detail&quot;],&quot;default&quot;:&quot;top&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;表示&quot;},&quot;startTip&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[1,2,3],&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;表示&quot;},&quot;startCvd&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;表示&quot;},&quot;forceStill&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;動き&quot;},&quot;animateCards&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;動き&quot;}}">
const TIPS = [
  { id: 1, cat: "返す", title: "最初のひと言は、受け止めてから返す",
    claim: "相手の最初のひと言には、自分の意見を返す前に、受け取ったことを伝えます。「そう考えたんですね」と一度受け止めてから、問いの形で返してみます。",
    why: "キャッチボールでは、ボールを一度グローブに収めてから投げ返します。受け取った手ごたえが相手に届くと、次の球も投げやすくなるようです。",
    apply: "明日、最初に返すひと言を「〜ということですか？」の形にしてみる。" },
  { id: 2, cat: "伝える", title: "「でも」より「それと」でつなぐ",
    claim: "相手の話に何かを足したいとき、「でも」ではなく「それと」で始めてみます。前の話を残したまま、自分の話を横に並べられます。",
    why: "二本の線が並んで伸びていくと、どちらも途中で途切れずに、先のほうで一本にまとまることがあります。話も並べておくと、重なる場所が見つかりやすくなります。",
    apply: "会議で一度だけ、「でも」と言いかけたところを「それと」に言い換えてみる。" },
  { id: 3, cat: "場をつくる", title: "「わからない」を先に言う",
    claim: "話についていけなくなったら、自分から先に「わからない」と言います。一人が言うと、まわりも疑問を出しやすくなります。",
    why: "誰か一人が手を挙げると、それまで小さかった声が少しずつ出てきます。わからないことが共有されると、その場で話せることの土台が広がっていきます。",
    apply: "次の打ち合わせで、最初の質問を「すみません、ここがわからなくて」から始めてみる。" },
];
const CATS = ["すべて", "聞く", "返す", "伝える", "ずれを直す", "場をつくる"];

class Component extends DCLogic {
  state = {
    page: this.props.startPage ?? "top",
    idx: Math.max(0, Math.min(TIPS.length - 1, (this.props.startTip ?? 1) - 1)),
    cat: "すべて",
    cvd: (() => { try { return localStorage.getItem("to-cvd") === "1"; } catch (e) { return false; } })() || !!this.props.startCvd,
  };
  sw(n, cvd) {
    const b = { width: n, height: n, borderRadius: "50%", boxSizing: "border-box", flexShrink: 0 };
    return cvd ? {
      speak: { ...b, background: "#26262B" },
      listen: { ...b, background: "#fff", border: "2px solid #26262B" },
      share: { ...b, background: "#fff", border: "1.5px dashed #26262B" },
    } : {
      speak: { ...b, background: "#DD6B4D" }, listen: { ...b, background: "#3F7CB0" }, share: { ...b, background: "#4FA27A" },
    };
  }
  go(page, idx) {
    this.setState(s => ({ page, idx: idx ?? s.idx }));
    window.scrollTo(0, 0);
  }
  renderVals() {
    const { page, idx, cat } = this.state;
    const no = id => String(id).padStart(2, "0");
    const filtered = TIPS.map((t, i) => ({ ...t, i, no: no(t.id), open: () => this.go("detail", i) }))
      .filter(t => cat === "すべて" || t.cat === cat);
    const still = !!this.props.forceStill;
    const cvd = this.state.cvd;
    return {
      cvd, cvdStr: cvd ? "true" : "false", sw10: this.sw(10, cvd), sw8: this.sw(8, cvd),
      cvdKnob: { width: 12, height: 12, borderRadius: "50%", boxSizing: "border-box", border: "1.5px solid #26262B", background: cvd ? "#26262B" : "transparent" },
      toggleCvd: () => this.setState(s => { const v = !s.cvd; try { localStorage.setItem("to-cvd", v ? "1" : "0"); } catch (e) {} return { cvd: v }; }),
      isTop: page === "top", isDetail: page === "detail", count: TIPS.length,
      cats: CATS.map(c => ({ label: c, active: c === cat, inactive: c !== cat, select: () => this.setState({ cat: c }) })),
      filtered, hasTips: filtered.length > 0, noTips: filtered.length === 0, catLabel: cat,
      cardStill: still || !(this.props.animateCards ?? true),
      still, tip: { ...TIPS[idx], no: no(TIPS[idx].id) },
      hasPrev: idx > 0, noPrev: idx === 0, hasNext: idx < TIPS.length - 1,
      prevTitle: TIPS[idx - 1]?.title, nextTitle: TIPS[idx + 1]?.title,
      goPrev: () => this.go("detail", idx - 1), goNext: () => this.go("detail", idx + 1),
      goTop: () => this.go("top"),
      openRandom: () => {
        let r = Math.floor(Math.random() * TIPS.length);
        if (page === "detail" && r === idx) r = (r + 1) % TIPS.length;
        this.go("detail", r);
      },
    };
  }
}
</script>
</body>
</html>
