<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes t1a{0%{transform:translate(60px,100px);opacity:0}6%{opacity:1}30%{transform:translate(106px,100px);opacity:1}50%{transform:translate(62px,48px);opacity:1}62%,100%{transform:translate(40px,22px);opacity:0}}
@keyframes t1b{0%{transform:translate(250px,100px);opacity:0}6%{opacity:1}30%{transform:translate(300px,100px)}40%,90%{transform:translate(320px,100px);opacity:1}100%{transform:translate(320px,100px);opacity:0}}
@keyframes t1c{0%,45%{transform:translate(302px,100px);opacity:0}50%{opacity:1}68%{transform:translate(275px,72px)}86%{transform:translate(250px,100px);opacity:1}94%,100%{transform:translate(250px,100px);opacity:0}}
@keyframes t1ring{0%,38%{opacity:0;transform:scale(1)}42%{opacity:.7;transform:scale(1)}58%,100%{opacity:0;transform:scale(1.5)}}
@keyframes t2c1{0%{stroke-dashoffset:1;opacity:1}18%,92%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes t2c2{0%,18%{stroke-dashoffset:1;opacity:1}32%{stroke-dashoffset:0;opacity:1}53%{opacity:1}60%,92%{stroke-dashoffset:0;opacity:.15}100%{stroke-dashoffset:0;opacity:0}}
@keyframes t2b{0%,38%{stroke-dashoffset:1;opacity:1}70%,92%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes t2l1{0%{stroke-dashoffset:1;opacity:1}30%,92%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes t2l2{0%,25%{stroke-dashoffset:1;opacity:1}55%,92%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes t2g{0%,58%{stroke-dashoffset:1;opacity:1}80%,92%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes t3hand{0%{stroke-dashoffset:1;opacity:1}10%,92%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes t3q{0%,10%{transform:scale(0);opacity:0}18%,92%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
@keyframes t3b1{0%,25%{transform:scale(.35)}33%,92%{transform:scale(1)}100%{transform:scale(.35)}}
@keyframes t3b2{0%,37%{transform:scale(.35)}45%,92%{transform:scale(1)}100%{transform:scale(.35)}}
@keyframes t3b3{0%,49%{transform:scale(.35)}57%,92%{transform:scale(1)}100%{transform:scale(.35)}}
@keyframes t3b4{0%,61%{transform:scale(.35)}69%,92%{transform:scale(1)}100%{transform:scale(.35)}}
@keyframes t3s{0%,18%{transform:scale(.3);opacity:.5}70%,92%{transform:scale(1);opacity:1}100%{transform:scale(.3);opacity:.5}}
@media (prefers-reduced-motion: reduce){[data-tv] *{animation:none !important}}
[data-tv][data-still="true"] *{animation:none !important}
[data-cvd="true"] [data-r=sf]{fill:#26262B}
[data-cvd="true"] [data-r=sl]{stroke:#26262B}
[data-cvd="true"] [data-r=sb]{fill:#26262B;stroke:#26262B}
[data-cvd="true"] [data-r=st]{fill:#fff}
[data-cvd="true"] [data-r=lf]{fill:#fff;stroke:#26262B;stroke-width:2.5px}
[data-cvd="true"] [data-r=ll]{stroke:#8A8690}
[data-cvd="true"] [data-r=lb]{stroke:#26262B}
[data-cvd="true"] [data-r=shf]{fill:#fff;stroke:#26262B;stroke-width:1.5px;stroke-dasharray:2 2}
[data-cvd="true"] [data-r=sht]{fill:#26262B}
[data-cvd="true"] [data-r=shl]{stroke:#26262B}
[data-cvd="true"] [data-r=sha]{fill:#26262B;fill-opacity:.06;stroke:#26262B;stroke-dasharray:4 3}
</style>
</helmet>
<div data-tv="1" data-still="{{ stillStr }}" data-cvd="{{ cvdStr }}" style="width:100%;line-height:0">
<sc-if value="{{ is1 }}" hint-placeholder-val="{{ true }}">
<svg viewBox="0 0 360 200" role="img" aria-label="左：相手の発言が跳ね返されて外へ飛んでいく。右：発言が一度受け止められ、問いになって話し手に戻る。" style="width:100%;height:auto;display:block;overflow:visible">
  <line x1="180" y1="30" x2="180" y2="170" stroke="#E2DED5" stroke-width="1"></line>
  <path d="M60 100 H104" data-r="sl" stroke="#DD6B4D" stroke-width="1.5" stroke-dasharray="3 4" opacity=".45" fill="none"></path>
  <path d="M106 100 L52 36" data-r="sl" stroke="#DD6B4D" stroke-width="1.5" stroke-dasharray="3 4" opacity=".45" fill="none"></path>
  <path d="M50 44 L50 33 L60 36" data-r="sl" stroke="#DD6B4D" stroke-width="1.5" opacity=".45" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
  <circle cx="40" cy="100" r="18" data-r="sf" fill="#DD6B4D"></circle>
  <circle cx="130" cy="100" r="18" data-r="lf" fill="#3F7CB0"></circle>
  <circle cx="0" cy="0" r="6" data-r="sf" fill="#DD6B4D" style="transform:translate(62px,48px);animation:t1a 5s cubic-bezier(.45,0,.3,1) infinite"></circle>
  <path d="M250 100 H300" data-r="sl" stroke="#DD6B4D" stroke-width="1.5" stroke-dasharray="3 4" opacity=".45" fill="none"></path>
  <path d="M304 90 Q276 58 252 88" data-r="shl" stroke="#4FA27A" stroke-width="1.5" stroke-dasharray="3 4" opacity=".7" fill="none"></path>
  <path d="M250 78 L251 89 L261 86" data-r="shl" stroke="#4FA27A" stroke-width="1.5" opacity=".7" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
  <circle cx="230" cy="100" r="18" data-r="sf" fill="#DD6B4D"></circle>
  <circle cx="320" cy="100" r="18" data-r="lf" fill="#3F7CB0"></circle>
  <circle cx="320" cy="100" r="22" fill="none" data-r="ll" stroke="#3F7CB0" stroke-width="1.5" style="opacity:0;transform-box:fill-box;transform-origin:center;animation:t1ring 5s ease-out infinite"></circle>
  <circle cx="0" cy="0" r="6" data-r="sf" fill="#DD6B4D" stroke="#fff" stroke-width="1.5" style="transform:translate(320px,100px);animation:t1b 5s cubic-bezier(.45,0,.3,1) infinite"></circle>
  <g style="transform:translate(276px,73px);animation:t1c 5s cubic-bezier(.45,0,.3,1) infinite">
    <circle cx="0" cy="0" r="9" data-r="shf" fill="#4FA27A"></circle>
    <text x="0" y="4" text-anchor="middle" font-size="11" font-weight="600" data-r="sht" fill="#fff" font-family="IBM Plex Sans JP, sans-serif">?</text>
  </g>
  <sc-if value="{{ captions }}" hint-placeholder-val="{{ true }}">
    <text x="85" y="160" text-anchor="middle" font-size="11" fill="#6A6770" font-family="IBM Plex Sans JP, sans-serif">跳ね返す</text>
    <text x="275" y="160" text-anchor="middle" font-size="11" fill="#26262B" font-family="IBM Plex Sans JP, sans-serif">受け止めて、問いで返す</text>
  </sc-if>
</svg>
</sc-if>
<sc-if value="{{ is2 }}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 360 220" role="img" aria-label="上：前の発言の線を断ち切って、別の線が引かれる。下：二本の線が横に並んで伸び、一本の線に合わさって先へ続く。" style="width:100%;height:auto;display:block;overflow:visible">
  <line x1="24" y1="113" x2="336" y2="113" stroke="#E2DED5" stroke-width="1"></line>
  <circle cx="24" cy="36" r="7" data-r="sf" fill="#DD6B4D"></circle>
  <circle cx="24" cy="70" r="7" data-r="lf" fill="#3F7CB0"></circle>
  <path d="M40 36 H180" pathLength="1" data-r="sl" stroke="#DD6B4D" stroke-width="3" stroke-linecap="round" fill="none" style="stroke-dasharray:1;stroke-dashoffset:0;animation:t2c1 6s ease-in-out infinite"></path>
  <path d="M180 36 H330" pathLength="1" data-r="sl" stroke="#DD6B4D" stroke-width="3" stroke-linecap="round" fill="none" style="stroke-dasharray:1;stroke-dashoffset:0;opacity:.15;animation:t2c2 6s ease-in-out infinite"></path>
  <path d="M40 70 H150 L180 22 L210 70 H330" pathLength="1" data-r="ll" stroke="#3F7CB0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" style="stroke-dasharray:1;stroke-dashoffset:0;animation:t2b 6s ease-in-out infinite"></path>
  <circle cx="24" cy="146" r="7" data-r="sf" fill="#DD6B4D"></circle>
  <circle cx="24" cy="180" r="7" data-r="lf" fill="#3F7CB0"></circle>
  <path d="M40 146 H190 Q214 146 232 163" pathLength="1" data-r="sl" stroke="#DD6B4D" stroke-width="3" stroke-linecap="round" fill="none" style="stroke-dasharray:1;stroke-dashoffset:0;animation:t2l1 6s ease-in-out infinite"></path>
  <path d="M40 180 H190 Q214 180 232 163" pathLength="1" data-r="ll" stroke="#3F7CB0" stroke-width="3" stroke-linecap="round" fill="none" style="stroke-dasharray:1;stroke-dashoffset:0;animation:t2l2 6s ease-in-out infinite"></path>
  <path d="M232 163 H330" pathLength="1" data-r="shl" stroke="#4FA27A" stroke-width="6" stroke-linecap="round" fill="none" style="stroke-dasharray:1;stroke-dashoffset:0;animation:t2g 6s ease-in-out infinite"></path>
  <sc-if value="{{ captions }}" hint-placeholder-val="{{ true }}">
    <text x="330" y="100" text-anchor="end" font-size="11" fill="#6A6770" font-family="IBM Plex Sans JP, sans-serif">断ち切ってから引く</text>
    <text x="330" y="208" text-anchor="end" font-size="11" fill="#26262B" font-family="IBM Plex Sans JP, sans-serif">横に並べて伸ばす</text>
  </sc-if>
</svg>
</sc-if>
<sc-if value="{{ is3 }}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 360 220" role="img" aria-label="一人が手を挙げて「わからない」と言うと、まわりの人の発言の円が順にふくらみ、真ん中の共有された場も広がっていく。" style="width:100%;height:auto;display:block;overflow:visible">
  <circle cx="180" cy="112" r="34" data-r="sha" fill="#4FA27A" fill-opacity=".22" stroke="#4FA27A" stroke-width="1.5" style="transform-box:fill-box;transform-origin:center;animation:t3s 7s ease-in-out infinite"></circle>
  <path d="M70 140 Q80 80 120 58 Q180 30 240 58 Q300 90 290 140 Q250 190 180 182 Q110 186 70 140" stroke="#CFCAC0" stroke-width="1.2" stroke-dasharray="2 5" fill="none"></path>
  <path d="M81 131 L93 108" pathLength="1" data-r="sl" stroke="#DD6B4D" stroke-width="3" stroke-linecap="round" fill="none" style="stroke-dasharray:1;stroke-dashoffset:0;animation:t3hand 7s ease-out infinite"></path>
  <circle cx="70" cy="140" r="13" data-r="sf" fill="#DD6B4D"></circle>
  <g style="transform-box:fill-box;transform-origin:center;animation:t3q 7s ease-out infinite">
    <circle cx="46" cy="110" r="11" data-r="sb" fill="#fff" stroke="#DD6B4D" stroke-width="2"></circle>
    <text x="46" y="114.5" text-anchor="middle" font-size="12" font-weight="600" data-r="st" fill="#DD6B4D" font-family="IBM Plex Sans JP, sans-serif">?</text>
  </g>
  <circle cx="120" cy="58" r="13" data-r="lf" fill="#3F7CB0"></circle>
  <circle cx="98" cy="34" r="10" data-r="lb" fill="#fff" stroke="#3F7CB0" stroke-width="2" style="transform-box:fill-box;transform-origin:center;animation:t3b1 7s ease-out infinite"></circle>
  <circle cx="240" cy="58" r="13" data-r="lf" fill="#3F7CB0"></circle>
  <circle cx="262" cy="34" r="10" data-r="lb" fill="#fff" stroke="#3F7CB0" stroke-width="2" style="transform-box:fill-box;transform-origin:center;animation:t3b2 7s ease-out infinite"></circle>
  <circle cx="290" cy="140" r="13" data-r="lf" fill="#3F7CB0"></circle>
  <circle cx="318" cy="116" r="10" data-r="lb" fill="#fff" stroke="#3F7CB0" stroke-width="2" style="transform-box:fill-box;transform-origin:center;animation:t3b3 7s ease-out infinite"></circle>
  <circle cx="180" cy="182" r="13" data-r="lf" fill="#3F7CB0"></circle>
  <circle cx="206" cy="204" r="10" data-r="lb" fill="#fff" stroke="#3F7CB0" stroke-width="2" style="transform-box:fill-box;transform-origin:center;animation:t3b4 7s ease-out infinite"></circle>
</svg>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:320},&quot;tipId&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[1,2,3],&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;still&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;cvd&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;captions&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const id = Number(this.props.tipId ?? 1);
    return {
      is1: id === 1, is2: id === 2, is3: id === 3,
      stillStr: this.props.still ? "true" : "false",
      cvdStr: this.props.cvd ? "true" : "false",
      captions: this.props.captions ?? true,
    };
  }
}
</script>
</body>
</html>
